<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14123b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI Journey">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
<title>AI Journey 200 - Bachon ke liye AI</title>
<style>
:root{--bg:#14123b;--card:#231f5c;--sun:#ffd23f;--paper:#fff8e7;--mint:#3ddc97;--coral:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--paper);font-family:Fredoka,ui-rounded,"Segoe UI",system-ui,sans-serif;overflow-x:hidden;min-height:100vh}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.sky i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.5)}}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:20px 16px 90px}
.hero{text-align:center;padding-top:10px}
.rocket{font-size:84px;display:inline-block;animation:launch 1.4s cubic-bezier(.2,1.2,.4,1) both,float 3s 1.4s ease-in-out infinite;filter:drop-shadow(0 12px 18px #0006)}
@keyframes launch{from{transform:translateY(420px) rotate(-8deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes float{50%{transform:translateY(-12px) rotate(4deg)}}
h1{font-size:clamp(30px,8vw,48px);line-height:1.1;margin:6px 0 8px;animation:pop .7s 1s both}
h1 b{color:var(--sun)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.hero p{font-size:18px;margin:0 auto;max-width:430px;opacity:.9;line-height:1.45}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 14px}
.pill{background:var(--card);border-radius:20px;padding:12px 6px;text-align:center;font-size:13px}
.pill b{display:block;font-size:28px;color:var(--sun)}
.fuel{background:var(--card);border-radius:22px;padding:16px 16px 14px}
.fuel p{margin:0 0 10px;font-size:15px}
.track{position:relative;height:18px;background:#0005;border-radius:99px;margin-right:26px}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--sun));transition:width .8s cubic-bezier(.3,1.3,.5,1)}
.fr{position:absolute;top:-11px;left:0;font-size:30px;transform:translateX(-30%) rotate(90deg);transition:left .8s cubic-bezier(.3,1.3,.5,1)}
h2{font-size:24px;margin:28px 0 12px}
.worlds{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.world{position:relative;all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:3px solid transparent;border-radius:26px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:3px;align-items:center;transition:transform .2s,border-color .2s}
.world:active{transform:scale(.94)}
.foldertab{align-self:flex-start;font-size:10px;font-weight:900;letter-spacing:1px;padding:4px 8px;border-radius:8px;background:var(--c);color:#10101f;margin:-4px 0 2px -4px}.world{box-shadow:0 8px 24px #0003}.world:hover{transform:translateY(-3px)}
.world:focus-visible,.day:focus-visible,.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.world.on{border-color:var(--c)}
.world b{font-size:18px}.world small{opacity:.75;font-size:12px}
.planet{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:36px;background:radial-gradient(circle at 30% 28%,#fff9,var(--c) 55%,#0006);box-shadow:0 8px 20px #0005;animation:bob 3.4s ease-in-out infinite}
.world:nth-child(2n) .planet{animation-delay:-1.2s}.world:nth-child(3n) .planet{animation-delay:-2.2s}
@keyframes bob{50%{transform:translateY(-7px)}}
.bar{display:block;width:80%;height:8px;border-radius:9px;background:#0005;overflow:hidden;margin:4px 0 2px}
.bar u{display:block;height:100%;background:var(--c);transition:width .6s}
.panel{margin-top:18px;background:var(--card);border-radius:26px;padding:18px;border:3px solid var(--c);animation:pop .35s both}
.panel[hidden]{display:none}
.panel h3{margin:0 0 6px;font-size:22px}
.panel p{margin:0 0 14px;line-height:1.45;opacity:.92}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.day{all:unset;box-sizing:border-box;cursor:pointer;height:52px;border-radius:16px;background:#0004;display:grid;place-items:center;font-size:17px;font-weight:500;transition:transform .15s}
.day:active{transform:scale(.88)}
.day.ok{background:var(--c);color:#14123b;font-weight:700}
.day.next{outline:3px dashed var(--sun);animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--paper);color:#14123b;border-radius:30px 30px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;transform:translateY(110%);transition:transform .4s cubic-bezier(.3,1.2,.5,1);box-shadow:0 -10px 40px #0008;max-width:760px;margin:0 auto}
.sheet.show{transform:none}
.sheet small{font-size:15px;opacity:.7}
.sheet h4{font-size:30px;margin:4px 0}
.sheet p{font-size:19px;margin:0 0 16px}
.btn{all:unset;cursor:pointer;display:inline-block;background:var(--coral);color:#fff;font-weight:700;font-size:20px;padding:14px 26px;border-radius:99px;box-shadow:0 5px 0 #b84444;margin:4px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b84444}
.btn.g{background:#ddd;color:#14123b;box-shadow:0 5px 0 #aaa}
.sheet{max-height:90vh;overflow:auto}
.tasks{display:grid;gap:8px;margin:0 0 14px;text-align:left}
.task{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:center;background:#14123b14;border-radius:16px;padding:12px 14px;font-size:16px;line-height:1.3}
.task i{flex:none;width:26px;height:26px;border-radius:9px;border:3px solid #14123b66;display:grid;place-items:center;font-style:normal;font-weight:700}
.task.on{background:#3ddc9755}.task.on i{background:var(--mint);border-color:var(--mint)}
.q{text-align:left;margin:0 0 14px;display:grid;gap:8px}.q b{font-size:19px;margin-bottom:2px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:3px solid #14123b22;border-radius:16px;padding:12px 14px;font-size:16px;line-height:1.3}
.opt.ok{background:var(--mint);border-color:var(--mint);font-weight:700}
.opt.no{background:#ff6b6b55;border-color:var(--coral);animation:shk .35s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.btn.s{background:var(--sun);color:#14123b;box-shadow:0 5px 0 #c9a21d;font-size:17px;margin:14px 0 0}
.note{background:#fff;border-left:6px solid var(--sun);border-radius:14px;padding:12px 14px;text-align:left;font-size:17px;line-height:1.5;margin:0 0 14px}
.timer{background:#14123b14;border-radius:20px;padding:10px;margin:0 0 14px}
.clock{font-size:46px;font-weight:700;margin:2px 0}
.mn{width:100%;min-height:90px;border-radius:16px;border:3px solid #14123b22;padding:12px;font:inherit;font-size:16px;margin:0 0 14px;resize:vertical;background:#fff;color:#14123b}
.ex{background:#14123b;color:var(--sun);border-radius:14px;padding:12px 14px;text-align:left;font:15px/1.5 ui-monospace,Menlo,monospace;margin:0 0 14px}
.story{background:#0003;border-radius:16px;padding:10px 12px;font-style:italic}
.fcard{all:unset;box-sizing:border-box;cursor:pointer;display:grid;place-items:center;width:100%;min-height:160px;padding:18px;border-radius:24px;background:#fff3c2;border:3px dashed #14123b44;font-size:20px;line-height:1.5;text-align:center;margin-bottom:8px}
.nav{display:flex;justify-content:center;gap:12px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mg .opt{font-size:14px;text-align:center;display:grid;place-items:center;min-height:62px}
.opt.sel{border-color:var(--sun);background:#fff3c2}
.ex{background:#fff;color:#14123b;border:3px solid #14123b22;font-family:inherit;text-align:center;font-size:16px}
.vz{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:16px 0 4px}.vz.c{flex-direction:column}
.col{display:flex;flex-direction:column;align-items:center}
.bx{position:relative;min-width:84px;margin-top:22px;padding:22px 12px 12px;background:#f1c27d;border:4px solid #a0692c;border-radius:6px 6px 18px 18px;font-weight:700}
.bx::before{content:"";position:absolute;top:-4px;left:-4px;right:-4px;height:12px;background:#d99a50;border:4px solid #a0692c;border-radius:6px 6px 0 0}
.bx .tg{position:absolute;top:-26px;left:50%;transform:translateX(-50%);background:#ff6b6b;color:#fff;padding:2px 12px;border-radius:99px;font-size:15px;white-space:nowrap;z-index:1}
.bx .vl{background:#fff;border-radius:10px;padding:6px 10px;display:block}
.ix{font-size:13px;opacity:.7;margin-top:2px}
.ch{background:#e8e4ff;border:3px solid #6c5ce7;border-radius:14px;padding:8px 12px;font-weight:600;font-size:16px}
.ar{font-size:22px}
.mcn{background:#ffd23f;border:4px solid #c9a21d;border-radius:14px;padding:10px 12px;font-weight:700}
.scr{background:#14123b;color:#3ddc97;border:6px solid #666;border-radius:10px;padding:16px 26px;font:700 22px ui-monospace,monospace}
.nest{border:3px dashed #6c5ce7;border-radius:14px;padding:10px;width:100%;margin-top:12px}.nest .nest{border-color:#ff6b6b;background:#ff6b6b18}
.cap{font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;text-align:left;background:#14123b;color:#ffd23f;border-radius:12px;padding:10px 12px;margin-top:12px}

.handnote{background:repeating-linear-gradient(to bottom,#fffdf4 0,#fffdf4 28px,#d9e5ff 29px,#fffdf4 30px);border:2px solid #14123b22;border-radius:18px;padding:14px 16px;text-align:left;margin:0 0 14px;box-shadow:0 5px 0 #14123b14;font-family:"Comic Sans MS","Bradley Hand",cursive;font-size:17px;line-height:1.6;position:relative}
.handnote:before{content:"📓 Handwritten Notes";display:block;font-family:inherit;font-weight:700;font-size:19px;margin-bottom:6px}
.handnote .hnline{margin:3px 0}
.dailygoal{background:#ffd23f;border-radius:16px;padding:11px 14px;text-align:left;margin:0 0 14px;font-weight:600;color:#14123b}
.dp{text-align:left;margin:0 0 14px;display:grid;gap:8px}
.dp div{background:#fff;border-radius:16px;padding:12px 14px;line-height:1.55;font-size:16px;border-left:6px solid var(--sun)}
.dp .h{border-color:var(--mint)}.dp .g{border-color:var(--coral)}
.dp b{display:block;margin-bottom:3px;font-size:17px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-150%);z-index:9;background:var(--sun);color:#14123b;font-weight:700;padding:12px 20px;border-radius:99px;transition:transform .4s cubic-bezier(.3,1.4,.5,1);text-align:center}
.toast.show{transform:translate(-50%,0)}
.conf{position:fixed;z-index:8;font-size:26px;pointer-events:none;animation:burst 1.2s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
@media (min-width:600px){.worlds{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>
<main>
  <section class="hero">
    <div class="rocket" aria-hidden="true">🚀</div>
    <h1>AI seekho,<br><b>200 din me!</b></h1>
    <p>Roz sirf ek chhota mission. 200 missions poore karo aur ban jao AI hero!</p>
  </section>
  <section class="pills" aria-label="Tumhari progress">
    <div class="pill">⭐<b id="n">0</b>mission poore</div>
    <div class="pill">🔥<b id="s">0</b>din ki streak</div>
    <div class="pill">🏅<b id="r">0</b>XP points</div>
  </section>
  <section class="fuel">
    <p>Rank: <b id="rk"></b><br>Rocket ka fuel: <b id="pt">0%</b> bhar gaya</p>
    <div class="track"><div class="fill" id="fill"></div><span class="fr" id="fr" aria-hidden="true">🚀</span></div>
  </section>
  <h2>Apni planet chuno 🪐</h2>
  <div class="worlds" id="worlds"></div>
  <section class="panel" id="panel" hidden>
    <h3 id="ph"></h3><p id="pp"></p><p class="story" id="stp"></p>
    <div class="days" id="days"></div>
    <button class="btn s" id="pq">🎯 Planet Quiz</button> <button class="btn s" id="fc">🃏 Flash cards</button> <button class="btn s" id="mg">🧩 Jodi milao</button> <button class="btn s" id="ff">🎲 Fun fact</button>
  </section>
</main>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Mission">
  <small id="sd"></small><h4 id="st"></h4><p id="ss"></p>
  <div class="note" id="nt"></div><div class="handnote" id="hn"></div><div class="dailygoal" id="dg"></div><div class="ex" id="ex"></div><div class="dp" id="dp"></div><div class="tasks" id="tk"></div><div class="timer" id="tm"></div><div id="qb"></div>
  <textarea class="mn" id="mn" placeholder="✍️ Meri notes: aaj kya seekha, apni bhasha me likho..."></textarea>
  <button class="btn" id="sb"></button><button class="btn g" id="sx">Band karo</button>
</div>
<div class="toast" id="toast" role="status"></div>

const N=["Variable ek labelled dabba hai: naam = dabba, value = andar ki cheez. Jaise age = 10.","print() computer se bolwata hai, input() computer ko sunne deta hai. Dono se baat-cheet hoti hai.","Data type batata hai cheez kaisi hai: int (poora number), float (dashmlav wala), str (text), bool (True/False).","Operators symbols hain: + joda, - ghata, * guna, / bhaag. Computer inse hisaab karta hai.","If/else computer ko faisla lena sikhata hai: agar baarish hai to chhatri lo, warna nahi.","Loop kaam ko baar-baar karwata hai, bina baar-baar likhe. Jaise 10 baar taali bajana.","While loop tab tak chalta hai jab tak shart sach rahe. Jaise jab tak bhookh hai, khao.","For loop list ki har cheez ko ek-ek karke dekhta hai, jaise class me roll call.","List ek line me rakhi cheezein hain: [apple, banana, mango]. Number se pehchan hoti hai, 0 se shuru.","Tuple list jaisa hai par badal nahi sakte. Jaise janam ki date, fix rehti hai.","Dictionary me naam se cheez dhundhte hain, jaise dictionary me shabd aur uska matlab.","Set me har cheez sirf ek baar aati hai. Duplicates apne aap hat jaate hain.","Function ek mini machine hai: ek baar banao, jitni baar chahiye utni baar chalao.","Parameter function ko di jaane wali cheez hai, jaise juicer me daale gaye fal.","return function ka jawab wapas deta hai, jaise machine se nikla juice.","Scope batata hai variable kahan chalta hai. Function ke andar ka dabba bahar nahi dikhta.","String methods text ko badalte hain: upper() bada, lower() chhota, split() tukde karta hai.","List methods: append() jodta hai, remove() hatata hai, sort() line me lagata hai.","Exception galti ko sambhalta hai. try/except se program crash nahi hota, pyaar se rukta hai.","File me data likhke save karte hain aur baad me wapas padh sakte hain, jaise copy me likhna.","Module dusron ka likha code hai jo import karke use karte hain. Dobara banane ki zaroorat nahi.","Package modules ka dabba hai. pip install se naye tools mil jaate hain, jaise toolbox.","Virtual environment har project ka alag kamra hai taaki tools aapas me na ladein.","OOP me code ko asli duniya ki cheezon jaisa banate hain: har cheez ke gun (data) aur kaam (function).","Class ek naksha (blueprint) hai, object usse bana asli ghar. Ek class se kai object ban sakte hain.","Inheritance me bachha class maa-baap ke gun le leta hai, aur apne naye gun jod sakta hai.","Lambda ek line ka chhota function hai, bina naam ke. Jaldi ke kaam ke liye.","Comprehension list ko ek hi line me banane ka short tareeka hai: [x*2 for x in numbers].","Debugging bug (galti) dhundhne ka khel hai. print karke dekho code kahan atka.","Mini project me seekhi saari cheezein milake ek chhota app banate hain. Ye asli maza hai!","Ratio do cheezon ki tulna hai, jaise 2:1. AI numbers ki tulna se hi seekhta hai.","Algebra me anjaan number ko x kehte hain aur use dhundhte hain. Jaise x + 3 = 5 to x = 2.","Math function machine hai: number daalo, doosra number nikalo. f(x) = x + 1.","Graph numbers ki tasveer hai. Line upar jaye to cheez badh rahi hai.","Coordinates kisi jagah ka pata hain: (x, y). Jaise treasure map pe \"3 aage, 2 upar\".","Vector ek teer hai jisme dishaa aur lambai hai, numbers me likha: [3, 2].","Matrix numbers ka jaal (grid) hai, rows aur columns me. Jaise tasveer ke pixels.","Matrix operations grid ko jodte, guna karte aur ghumate hain. AI isi se data badalta hai.","Probability batati hai kitni sambhavna hai. Sikka uchhalne pe head aane ka chance 1/2 hai.","Statistics bahut saare data se matlab ki baat nikalna hai, jaise class ke number dekhna.","Mean sabka average hai, median beech ka number hai. Dono batate hain \"aam\" kya hai.","Variance batata hai data kitna phaila hua hai. Sab ek jaise ho to variance kam.","Distribution batata hai data kaise failta hai. Ghanti jaisa shape sabse mashhoor hai.","Derivative batata hai cheez kitni tezi se badal rahi hai, jaise gaadi ki speed.","Gradient pahaadi ka dhalaan hai: batata hai kidhar chadhai hai, kidhar utraai.","Optimization sabse acchha jawab dhundhna hai, jaise pahaadi se neeche sabse gehri jagah.","Linear algebra vectors aur matrices ki bhasha hai. AI ke andar sab yahi chalta hai.","ML ke liye math: vectors se data, probability se andaza, derivative se seekhna.","Quiz se pata chalta hai kya samjhe. Galat hua to koi baat nahi, dobara try karo!","Math project me seekha hua math asli kaam me lagate hain. Chhota example banao.","Data jaankari hai: numbers, text, tasveer. AI ka khaana yahi hai.","CSV ek simple table file hai jisme values comma se alag hoti hain. Excel jaisi.","Pandas Python ka tool hai jo bade tables ko aasani se sambhalta hai.","DataFrame Pandas ka table hai: rows (line) aur columns (khaane), Excel sheet jaisa.","Filtering me sirf kaam ki rows chunte hain, jaise sirf 10 saal se bade bachhe.","Sorting data ko line me lagata hai: chhote se bade, ya A se Z tak.","Missing value khaali khaana hai. Use bharte hain ya hata dete hain.","Cleaning data ko saaf karna hai: galtiyan sudharo, kachra hatao, tabhi AI sahi seekhega.","Duplicate ek hi cheez ka dobara aana hai. Hatao warna AI ek hi baat baar-baar seekhega.","Outlier bahut ajeeb sa number hai, jaise class me ek bachhe ki height 10 feet likhi ho.","Visualization data ko chitra me badalta hai. Chart dekhke baat jaldi samajh aati hai.","Matplotlib Python ka chart banane wala tool hai: line, bar, sab kuch.","Seaborn Matplotlib se sundar aur smart charts banata hai, kam code me.","Feature AI ko di jaane wali jaankari hai. Naye feature banane se AI aur smart hota hai.","Data ko do hisso me baantte hain: padhne wala (train) aur pariksha wala (test).","Correlation batata hai do cheezein saath-saath badalti hain ya nahi, jaise dhoop aur garmi.","Data leakage me AI ko pariksha ka jawab pehle hi mil jaata hai. Ye dhokha hai!","EDA me data se sawaal puchhte hain: kya dikh raha hai? kuch ajeeb hai? jaasoos ki tarah.","Data project me ek asli data lekar sawaal puchho, saaf karo aur chart banao.","Data quiz: dekho CSV, Pandas, cleaning kitna yaad hai. Galti se seekhna aata hai!","SQL database se baat karne ki bhasha hai. SELECT se data mangwate hain.","Join do tables ko ek common column se jodta hai, jaise naam se roll number milana.","Aggregation bahut rows ka ek jawab deta hai: total, average, ginti, sabse bada.","Pipeline data ki assembly line hai: lo, saaf karo, badlo, aage bhejo.","Data mini project me poori pipeline banate ho: data aaya, saaf hua, jawab nikla.","ML me computer ko rules nahi, examples dikhate hain, aur wo khud pattern seekhta hai.","Supervised learning me examples ke saath sahi jawab bhi hota hai, jaise teacher ke saath padhna.","Unsupervised me sahi jawab nahi hota, computer khud milte-julte group dhundhta hai.","Regression kisi number ki bhavishyavani hai, jaise kal ka temperature.","Classification kisi cheez ko group me daalta hai, jaise ye photo billi ki hai ya kutte ki.","Linear regression data ke beech ek seedhi line khinchke andaza lagata hai.","Logistic regression haan/na ka jawab deta hai, jaise email spam hai ya nahi.","Decision tree haan/na sawaalon ka ped hai, jaise 20 sawaal wala khel.","Random forest bahut saare decision trees ka vote hai. Bheed ka faisla aksar sahi hota hai.","KNN dekhta hai tumhare sabse paas wale padosi kaun hain, aur unke jaisa maanta hai.","SVM do groups ke beech sabse badi, saaf seedhi line (deewar) khinchta hai.","Naive Bayes probability se andaza lagata hai, jaise ye shabd aaye to email spam hoga.","Clustering milti-julti cheezon ko group karta hai, bina naam bataye. Jaise rang ke hisaab se khilone.","K-Means data ko K groups me baantta hai, har group ka ek centre hota hai.","PCA bahut saari jaankari ko chhote roop me dabata hai, zaroori baat bachake.","Scaling sab numbers ko ek jaise paimane par laata hai, taaki bada number haavi na ho.","Cross validation data ko kai tarah se baantke test karta hai, taaki result bharose ka ho.","Overfitting me AI ratta maar leta hai, naye sawaal par fail ho jaata hai.","Underfitting me AI ne kam seekha, wo aasaan sawaal bhi galat karta hai.","Bias aur variance ka santulan: na bahut saral, na bahut ratta, beech ka raasta sahi.","Accuracy batati hai kitne jawab sahi hue. 9/10 sahi to 90%.","Precision: jab AI ne \"haan\" kaha, to kitni baar wo sach tha?","Recall: jitne asli \"haan\" the, unme se AI ne kitne pakde?","F1 Score precision aur recall dono ko milake ek achhi score deta hai.","Confusion matrix sahi aur galat jawabon ki table hai, kahan confuse hua wo dikhata hai.","ROC/AUC batata hai model do groups ko kitna achhe se alag karta hai. 1 sabse achha.","Hyperparameter AI ki settings hain jo humein pehle chunni padti hain, jaise TV ka volume.","Grid search saari settings ek-ek karke try karta hai aur sabse achhi chunta hai.","Random search kuch settings randomly try karta hai. Kam samay me achha jawab.","Feature selection me sirf kaam ki jaankari rakhte hain, bekar hata dete hain.","Imbalanced data me ek group bahut kam hota hai, jaise 100 me 1 bimar. AI ko dhyan dena padta hai.","ML pipeline saare steps ko ek chain me jodta hai taaki bar-bar dohraana na pade.","Model saving se sikha hua AI file me save hota hai, baad me bina dobara seekhe use karo.","ML project me data se model banake sach me kuch predict karte ho. Maza yahi hai!","ML quiz: dekho regression, classification aur overfitting kitna samjhe.","Neural network insaani dimaag se prerit hai: bahut saare chhote neurons milke seekhte hain.","Neuron input leta hai, hisaab karta hai aur aage jawab bhejta hai.","Weight batata hai input kitna zaroori hai, bias thoda dhakka deta hai. AI yahi seekhta hai.","Activation function tay karta hai neuron \"jalega\" ya nahi, jaise switch.","ReLU simple hai: negative ko 0 bana do, positive jaisa rehne do.","Sigmoid kisi bhi number ko 0 aur 1 ke beech daba deta hai, jaise probability.","Forward pass me input network se guzarke jawab tak jaata hai, aage-aage.","Loss batata hai AI ka jawab sahi se kitna door hai. Jitna kam, utna achha.","Backpropagation galti ko peeche bhejke har weight ko sudharta hai.","Gradient descent loss ko kam karne ke liye chhote-chhote kadam neeche utarta hai.","Epoch poora data ek baar dekhna hai, batch ek baar me kuch hi examples dekhna.","Optimizer tay karta hai weights kaise badlein. Adam sabse mashhoor hai.","Learning rate kadam ka size hai. Bahut bada kadam galat, bahut chhota dheema.","CNN tasveer dekhne me mahir hai. Chhote hisse dekhke bade pattern pehchanta hai.","RNN kramwar cheezein (shabd) padhta hai aur pichhli baat yaad rakhta hai.","LSTM RNN ka behtar roop hai jo lambi baatein yaad rakh sakta hai.","Embedding shabd ko numbers me badalta hai, milte-julte shabd paas-paas aate hain.","Transfer learning me pehle se seekha model naye kaam ke liye use hota hai, jaise cycle se bike seekhna.","PyTorch neural network banane ka Python tool hai, seekhne me dost jaisa.","TensorFlow Google ka AI banane wala tool hai, bade kaamon ke liye mashhoor.","GPU bahut sare kaam ek saath karta hai, isliye AI ki training tez hoti hai.","Regularization AI ko ratta maarne se rokta hai, thodi saadgi sikhata hai.","Dropout training me kuch neurons ko randomly band karta hai, taaki sab milke seekhein.","DL project me khud ka neural network banake kuch pehchaanna sikhate ho.","DL quiz: neuron se backpropagation tak, dekho kitna yaad hai.","Generative AI naya banata hai: kahani, tasveer, music. Sirf pehchanta nahi.","LLM bahut saari kitaabein padhke seekha AI hai jo agla shabd sochta hai.","Token text ka chhota tukda hai. AI shabd nahi, tokens padhta hai.","Embedding matlab ko numbers me badalti hai. Isse AI \"samajh\" paata hai kaun se shabd milte hain.","Transformer wo design hai jo aaj ke bade AI ki neev hai. Ek saath pura vaakya dekhta hai.","Attention AI ko batata hai vaakya me kis shabd par zyada dhyan dena hai.","Prompt AI ko diya gaya sawaal ya hukum hai. Saaf likho to behtar jawab milega.","System prompt AI ko pehle se batata hai wo kaun hai aur kaise baat kare.","Few-shot me AI ko 2-3 example dikhake kehte hain \"aise hi karo\".","Structured output me AI se tay format (jaise JSON) me jawab mangwate hain.","Temperature AI ki kalpana (creativity) ka dial hai. Kam = pakka, zyada = rangeen.","Context window AI ki yaadasht ki had hai: ek baar me kitna text dekh sakta hai.","RAG me AI pehle documents me dhundhta hai, phir unke aadhar par jawab deta hai.","Vector database meaning ke hisaab se cheezein dhundhta hai, naam se nahi.","Chunking bade document ko chhote tukdon me todta hai taaki dhundhna aasaan ho.","Retrieval sawaal ke sabse milte-julte tukde dhundhkar nikalta hai.","Reranking nikale hue tukdon ko dobara sabse kaam ke order me lagata hai.","Tool calling me AI calculator ya search jaise tools ko chalane ka hukum de sakta hai.","Agent AI hai jo khud sochkar kai step lekar kaam poora karta hai.","Function calling AI se tay function ko sahi inputs ke saath chalwana hai.","AI safety ka matlab AI insaan ke liye surakshit aur sahi rahe, gandi cheezein na kare.","GenAI app me AI ko ek sundar app ke andar lagake logon ke kaam ki cheez banate hain.","GenAI quiz: prompt, RAG aur tokens kitne samjhe, check karo.","Prompt project me alag-alag prompts try karke dekhte ho kaun sabse achha jawab deta hai.","RAG mini project me apne documents par sawaal-jawab karne wala AI banate ho.","API ek khidki hai jisse ek software doosre se baat karta hai, jaise restaurant ka waiter.","REST API web par seedhe request-response se kaam karti hai: GET lo, POST bhejo.","FastAPI Python se tez web API banane ka aasaan tool hai.","Frontend wo hai jo user dekhta aur dabata hai: buttons, rang, page.","JavaScript webpage ko jeevit banati hai: click, animation, sab kuch.","Git code ka time machine hai. Har badlav save hota hai, gadbad ho to purane par wapas.","GitHub me Git ka code online rakhte hain, saath milke kaam aur dunia ko dikhane ke liye.","Docker ek dabba hai jisme app apne saare saaman ke saath kahin bhi chal sakta hai.","Environment variable me password jaisi secret cheezein code se alag rakhte hain.","Authentication pehchanta hai ki user kaun hai, jaise login. Sahi chabi to andar.","Database data ko surakshit aur vyavasthit tareeke se rakhta hai, bahut bada register jaisa.","Cloud ka matlab kisi aur ke bade computer (internet par) ko kiraye par lena.","Deployment me banaya AI app internet par rakhte hain taaki sab use kar sakein.","Monitoring app ko dekhte rehna hai, jaise doctor ka health check: sab theek chal raha hai?","Logging app ke har kaam ko diary me likhta hai, galti dhundhne me kaam aata hai.","Testing me code ko pehle jaanchte hain taaki users tak galti na pahunche.","CI/CD testing aur release apne aap karta hai. Code daalo, baaki robot sambhale.","Scaling me jab users bahut badh jaate hain to app ko bada karte hain, jaise dukaan me aur counter.","AI engineering project me data se leke app tak, sab milake ek asli AI service banate ho.","Capstone aakhri bada mission hai. Jo seekha sab jodke apna poora AI app banao aur dunia ko dikhao! 🎓"];
const DP={"1":["Computer ko cheezein yaad rakhni hoti hain, jaise naam ya score. Variable yaad rakhne ki jagah hai.","Likho naam = \"Riya\". Yahan = ka matlab \"andar rakho\" hai. Baad me naam likhoge to Riya mil jaayega. naam = \"Aman\" likhne se andar ki cheez badal jaati hai.","Naam me space nahi hota (my_name sahi hai). Chhota-bada akshar alag hota hai: Naam aur naam do alag dabbe hain."],"2":["Bina print ke computer andar hi andar kaam karta hai, humein kuch dikhta nahi. print() se jawab screen pe aata hai.","print(\"Hello\") likho aur Run dabao. Quotes ke andar jo likha wahi dikhega. input() computer ko ruk kar tumhara jawab sunne ko kehta hai: naam = input(\"Naam kya hai? \")","Quotes band karna mat bhoolna. input() ka jawab hamesha text hota hai, number nahi."],"3":["Computer ko pata hona chahiye ki cheez number hai ya text, tabhi wo sahi kaam karega.","10 int hai, 2.5 float, \"hi\" str (text), True/False bool. type(10) likhke computer se pooch sakte ho. \"10\" quotes me ho to wo text hai, number nahi!","\"5\" + \"3\" = \"53\" (text jud gaya), 5 + 3 = 8 (number jud gaye). Dono me farak hai."],"4":["Hisaab-kitaab computer ka sabse bada kaam hai. Operators uske symbols hain.","+ joda, - ghata, * guna, / bhaag, ** power (2**3 = 8), % bachi hui sankhya (7 % 2 = 1). Pehle * aur /, phir + aur -, jaise school ke math me.","Guna ke liye x nahi, * likhte hain. / ka jawab dashmlav me aata hai (10/4 = 2.5)."],"5":["Roz hum faisle lete hain: baarish ho to chhatri lo. If/else computer ko yahi sikhata hai.","if marks > 40: print(\"Pass\") else: print(\"Fail\"). Shart sach hui to if wala kaam chalega, warna else wala. Beech me elif se teesra raasta bhi ban sakta hai.","if ke baad colon : lagana zaroori hai. Agli line thodi andar (indent) likho. Barabar dekhne ke liye == use karo, = nahi."],"6":["100 baar \"Hello\" likhna thaka dega. Loop ye kaam computer se karwa deta hai.","Loop ek kaam ko kai baar dohraata hai. Do tarah ke hote hain: for (pata hai kitni baar) aur while (jab tak shart sach). Dono me andar ka kaam thoda andar (indent) likhte hain.","Loop band hone ka raasta zaroor rakho, warna wo hamesha chalta rahega (infinite loop)."],"7":["Kabhi pata nahi hota kitni baar karna hai, bas \"tab tak karo jab tak shart sach hai\".","count = 0 se shuru. while count < 3: print(count) aur count += 1. Har baar count badhta hai: 0, 1, 2. Jab count 3 ho gaya, shart jhooth ho gayi aur loop ruk gaya.","count += 1 likhna bhool gaye to count kabhi nahi badhega aur loop kabhi nahi rukega!"],"8":["List me bahut cheezein hoti hain, har ek par kaam karna ho to for loop sabse aasaan hai.","for fal in [\"aam\",\"kela\"]: print(fal). fal pehle aam pakadta hai, kaam hota hai, phir kela. List khatam to loop khatam. range(5) likho to 0 se 4 tak ginti chalti hai.","range(5) me 5 shaamil nahi hota: 0, 1, 2, 3, 4."],"9":["Ek-ek cheez ke liye alag variable banana mushkil hai. List sabko ek line me rakhti hai.","fal = [\"aam\",\"kela\",\"santra\"]. Ginti 0 se shuru: fal[0] aam, fal[1] kela. fal[-1] sabse aakhri cheez deta hai. len(fal) batata hai kitni cheezein hain.","Pehli cheez fal[1] nahi, fal[0] hai. Jo number hai hi nahi wo likhoge to error aayega."],"10":["Kuch cheezein kabhi nahi badalni chahiye, jaise janm ki date. Tuple unhe surakshit rakhta hai.","jagah = (28.6, 77.2). Gol bracket ( ) se banta hai. Padh sakte ho jagah[0], par badal nahi sakte, nahi to error aayega.","Ek cheez wala tuple banane ke liye comma lagao: (5,). Sirf (5) to number hi rehta hai."],"11":["Naam se cheez dhundhna aasaan hota hai, jaise phone me naam se number dhundhna.","bachha = {\"naam\":\"Riya\",\"umra\":10}. Curly bracket { } me key:value jodi hoti hai. bachha[\"naam\"] likho to Riya milega. Naya jodna: bachha[\"shehar\"] = \"Delhi\".","Key ek hi baar aati hai. Dobara likhoge to nayi value purani ko badal degi."],"12":["Kabhi sirf alag-alag cheezein chahiye, bina duplicate ke. Set ye khud kar deta hai.","{1,2,2,3} likho to set {1,2,3} ban jaata hai. 2 ek hi baar rahega. Set me number (index) nahi hota, isliye set[0] nahi chalega.","Khaali set { } nahi, set() se banta hai, kyunki { } khaali dictionary hai."],"13":["Wahi kaam baar-baar likhna thaka deta hai. Function ek baar likho, baar-baar chalao.","def namaste(): print(\"Namaste\"). def ka matlab \"ye function bana rahe hain\". Chalane ke liye namaste() likho. Sirf bana ke chhod do to chalta nahi, bulana padta hai.","Function ke andar ka kaam indent karke likho. Naam ke baad () aur : mat bhoolna."],"14":["Function ko alag-alag cheezon par chalana ho to usko input dena padta hai.","def namaste(naam): print(\"Namaste\", naam). Ab namaste(\"Riya\") likho to Namaste Riya, namaste(\"Aman\") to Namaste Aman. Ek hi function, kai jawab.","Parameter wo naam hai jo def me likha (naam). Argument wo asli cheez hai jo bulate waqt di (\"Riya\")."],"15":["Kabhi function ka jawab aage kisi kaam me lagana hota hai, sirf dikhana kaafi nahi.","def double(x): return x * 2. double(4) ka jawab 8 wapas aata hai, jise variable me rakh sakte ho: ans = double(4). return ke baad function wahin khatam ho jaata hai.","print aur return alag hain. print sirf dikhata hai, return jawab wapas deta hai."],"16":["Alag jagah ke variable aapas me na ladein, isliye har variable ka apna ghar hota hai.","Function ke andar bana x sirf wahin dikhta hai (local). Bahar bana y poore program me dikhta hai (global). Function y ko dekh sakta hai, par bahar wala x ko nahi dekh sakta.","Function ke andar bane x ko bahar print karoge to error aayega."],"17":["Text ke saath roz kaam padta hai: bada karna, tukde karna, dhundhna.","\"hello\".upper() = HELLO. .lower() chhota, .split() text ko tukdon me todta hai, .replace(\"a\",\"b\") badalta hai, len(\"hello\") = 5.","Text badal nahi sakta. s.upper() likhne se s nahi badlega, naya text milega. Use naye variable me rakho."],"18":["List me cheezein jodni, hatani, line me lagani hoti hain. List methods ye kaam karte hain.","fal.append(\"santra\") aakhir me jodta hai. .remove(\"aam\") hatata hai. .sort() line me lagata hai. .insert(0,\"ber\") kisi bhi jagah daalta hai. .pop() aakhri cheez nikaal deta hai.",".append() ek hi cheez jodta hai. Kai cheezein jodni hon to .extend() use karo."],"19":["Galti sabse hoti hai. Exception se program girta nahi, sambhal jaata hai.","try: 10/0 except: print(\"Oops!\"). try me khatarnaak kaam rakhte hain. Galti hui to except chalta hai. ZeroDivisionError jaisa naam likhke khaas galti pakad sakte ho.","Sab galtiyan chhupa mat do. Jo pakdo uske baare me kuch print karo, warna dhundhna mushkil hoga."],"20":["Variable band hote hi sab bhool jaata hai. File me save karoge to hamesha rahega.","open(\"notes.txt\",\"w\") likhne ke liye kholta hai, \"r\" padhne ke liye. f.write(\"Hello\") likho aur f.close() se band karo. with open(...) as f: likhoge to apne aap band ho jaati hai.","\"w\" se khologe to purani file saaf ho jaati hai! Jodne ke liye \"a\" use karo."],"21":["Har cheez khud likhna zaroori nahi. Module me dusron ka likha accha code mil jaata hai.","import math likho. Phir math.sqrt(16) = 4.0, math.pi = 3.14159. random.randint(1,6) pasa phenkta hai. Module ek tool ka dabba hai jo import karne par khulta hai.","Pehle import likho, phir use karo. math.sqrt me math ke baad . (dot) zaroor lagao."],"22":["Bahut saara accha code duniya bhar ke logon ne banaya hai. Package unhe tumhare computer tak laata hai.","Terminal me pip install pandas likho. Internet se pandas download hokar aa jaata hai. Phir import pandas as pd likhke use karo. as pd chhota naam hai.","Naam sahi likho (pandas, panda nahi). Internet band ho to download nahi hoga."],"23":["Alag projects ko alag version ke tools chahiye ho sakte hain. Virtual environment sabko alag kamra deta hai.","python -m venv myenv se kamra banta hai. Phir activate karte ho. Ab pip install sirf isi kamre me hoga. Project khatam to kamra delete kar do, computer saaf rehta hai.","Activate karna mat bhoolna. Warna tools bahar wale (global) kamre me install ho jaayenge."],"24":["Asli duniya me cheezon ke gun aur kaam hote hain. OOP code ko waisa hi banane deta hai.","Socho kutta: gun naam, umra, rang (data). Kaam bhaukna, daudna (function). OOP me dono ek saath ek object me rakhte hain. Isse bada code samajhna aur badalna aasaan hota hai.","OOP bada naam lagta hai, par idea bas yahi hai: data aur kaam ek saath."],"25":["Sau kutte banane hon to har ek ka alag code likhna bekaar hai. Class ek baar likhke sau object banati hai.","class Kutta: def bhaukna(self): print(\"Bhau!\"). Phir tommy = Kutta() se ek kutta banta hai. tommy.bhaukna() likho to Bhau! self ka matlab \"main khud\" hai.","Class ka naam bade akshar se shuru karna rivaaj hai (Kutta). Object banate waqt () lagao."],"26":["Naya class zero se kyun banayein jab purane ke gun le sakte hain?","class Puppy(Kutta): ... bracket me maa-baap class ka naam. Ab Puppy ko bhaukna() free me mil gaya. Chaho to Puppy me naya kaam (jaise khelna) bhi jod do.","Bachha class maa-baap ke kaam ko badal bhi sakta hai (override), jaise Puppy dheere bhaukta hai."],"27":["Kabhi bas ek chhota kaam chahiye, uske liye poora function likhna bhaari lagta hai.","double = lambda x: x * 2. lambda ke baad input, colon ke baad jawab. double(4) = 8. Ye def double(x): return x*2 ka chhota roop hai, ek line me.","Lambda me sirf ek expression ho sakta hai. Lambe kaam ke liye normal function hi sahi."],"28":["Ek hi line me list banana, loop se jaldi aur saaf hota hai.","[x * 2 for x in [1,2,3]] = [2,4,6]. Padho aise: har x ke liye x*2 karo aur list banao. Shart bhi laga sakte ho: [x for x in nums if x > 2].","Bahut lambi comprehension padhna mushkil hota hai. Samajh na aaye to normal loop likho."],"29":["Har programmer se galtiyan hoti hain. Bug dhundhna ek jaasoosi khel hai.","Pehle error message padho, wo batata hai kaun si line. Phir print() se variables dekho. Ek-ek hissa chalake dekho kahan galat hua. Ek badlav karke dobara chalao.","Ghabrao mat, error ka matlab computer madad kar raha hai. Ek baar me ek hi cheez badlo."],"30":["Ab tak seekhi saari cheezein ek asli project me jodke pakki ho jaati hain.","Chhota app socho: Calculator ya Quiz game. Steps: 1) kya karna hai likho 2) variables banao 3) input lo 4) if/else aur loop lagao 5) function banao 6) chalake test karo.","Pehle chhota banao jo chal jaye, phir usme naye feature jodo. Ek baar me sab mat likho."]};

function vis(d){const s=D[d];if(!s)return"";const[t,...a]=s;let h="",c="";
  if(t=="box")h=`<div class="bx"><span class="tg">${a[0]}</span><span class="vl">${a[1]}</span></div>`;
  else if(t=="scr")h=`<div class="scr">&gt; ${a[0]}</div>`;
  else if(t=="types")h=a[0].map(x=>`<div class="ch"><b>${x[0]}</b><br><small>${x[1]} · ${x[2]}</small></div>`).join("");
  else if(t=="ops"){const f=n=>"🍎".repeat(n);h=`<div class="ch">${f(a[0])}</div><span class="ar">➕</span><div class="ch">${f(a[1])}</div><span class="ar">＝</span><div class="ch"><b>${a[0]+a[1]}</b></div>`}
  else if(t=="fork"){c=" c";h=`<div class="ch">❓ ${a[0]}</div><div class="ch">👍 haan ➜ ${a[1]}</div><div class="ch">👎 nahi ➜ ${a[2]}</div>`}
  else if(t=="loop")h=Array.from({length:a[1]},(_,i)=>`<div class="ch">${a[0]} <small>${i+1}</small></div>`).join('<span class="ar">↻</span>');
  else if(t=="mc")h=(a[0]?`<div class="ch">${a[0]}</div><span class="ar">➡️</span>`:"")+`<div class="mcn">⚙️ ${a[1]}</div><span class="ar">➡️</span><div class="ch">${a[2]}</div>`;
  else if(t=="flow"){c=" c";h=a[0].map(x=>`<div class="ch">${x}</div>`).join('<span class="ar">⬇️</span>')}
  else if(t=="dict"){c=" c";h=a[0].map(x=>`<div class="ch"><b>${x[0]}</b> ➜ ${x[1]}</div>`).join("")}
  else if(t=="list")return`<div class="vz">${a[0].map((x,i)=>`<div class="col"><div class="bx"><span class="vl">${x}</span></div><span class="ix">${i}</span></div>`).join("")}</div><small>${a[1]}</small>`;
  else if(t=="nest")return`<div class="nest"><b>${a[0]}</b><div class="nest"><b>${a[1]}</b><br>${a[2]}</div></div>`;
  return`<div class="vz${c}">${h}</div>`}

function streak(){const s=new Set(Object.values(done));let d=new Date(),n=0;if(!s.has(iso(d)))d.setDate(d.getDate()-1);while(s.has(iso(d))){n++;d.setDate(d.getDate()-1)}return n}
function render(){
  const n=Object.keys(done).length,p=Math.round(n/1.8);
  $("n").textContent=n;$("s").textContent=streak();$("r").textContent=xpv();$("rk").textContent=RK.filter(r=>xpv()>=r[0]).pop()[1];
  $("pt").textContent=p+"%";$("fill").style.width=p+"%";$("fr").style.left=p+"%";
  $("worlds").innerHTML=W.map((w,i)=>{const t=w[3]-w[2]+1,c=cnt(w[2],w[3]);
    return `<button class="world folder${i===cur?" on":""}" title="${w[0]} folder kholo" aria-label="${w[0]} folder kholo — Din ${w[2]} se ${w[3]}" style="--c:${w[4]}" data-i="${i}"><span class="foldertab">FOLDER</span><span class="planet">${w[1]}</span><b>${w[0]}${c===t?" 🏅":""}</b><small>Din ${w[2]}-${w[3]}</small><i class="bar"><u style="width:${Math.round(c/t*100)}%"></u></i><small>${c}/${t} mission</small></button>`}).join("");
  if(cur>=0){const w=W[cur];let nx=0,h="";
    for(let i=w[2];i<=w[3];i++)if(!done[i]){nx=i;break}
    for(let i=w[2];i<=w[3];i++)h+=`<button class="day${done[i]?" ok":""}${i===nx?" next":""}" data-d="${i}" aria-label="Din ${i}">${done[i]?"✓":i}</button>`;
    $("days").innerHTML=h;$("panel").style.setProperty("--c",w[4]);
    $("ph").textContent=w[1]+" "+w[0]+" planet";$("pp").textContent=w[5]+" Chamakte number pe tap karo, wo tumhara agla mission hai.";$("stp").textContent="📖 "+S[cur];$("panel").hidden=false}
}
function toast(m,ms){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),ms||2600)}
const hideAll=()=>{clearInterval(tmr);["nt","hn","dg","ex","dp","tk","tm","mn","sb"].forEach(k=>$(k).style.display="none")};
function boom(){const e=["⭐","🎉","✨","🌟","🚀"];
  for(let i=0;i<22;i++){const s=document.createElement("span");s.className="conf";s.textContent=e[i%5];
    s.style.left="50%";s.style.top="60%";s.style.setProperty("--x",(Math.random()*340-170)+"px");s.style.setProperty("--y",(-Math.random()*320-40)+"px");
    document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}}
function openSheet(d){day=d;const pi=P(d);$("sd").textContent="Din "+d;$("st").textContent=T[d-1][0];$("ss").textContent=T[d-1][1];
  ["nt","hn","dg","ex","dp","tk","tm","mn","sb"].forEach(k=>$(k).style.display="");
  $("ex").style.display=E[d]?"":"none";$("ex").innerHTML=E[d]?"<b>💡 Example: chitra dekho</b>"+vis(d):"";if(E[d]){const c=document.createElement("div");c.className="cap";c.textContent=E[d];$("ex").appendChild(c)}
  const dd=$("dp");dd.innerHTML="";dd.style.display=DP[d]?"":"none";
  if(DP[d])[["🤔 Kyun chahiye?","k"],["⚙️ Kaise kaam karta hai?","h"],["⚠️ Dhyan rakho","g"]].forEach((x,i)=>{const e=document.createElement("div"),b=document.createElement("b");e.className=x[1];b.textContent=x[0];e.append(b,DP[d][i]);dd.appendChild(e)});
  const pack=dailyPack(d);
  $("nt").textContent="📖 Aise samjho: "+N[d-1];
  $("hn").innerHTML=`<div class="hnline">✏️ ${pack[0]}</div><div class="hnline">🔎 Topic: ${T[d-1][0]} — ${T[d-1][1]}</div><div class="hnline">💡 ${pack[2]}</div>`;
  $("dg").textContent="🎯 Aaj ka Daily Task: "+pack[1];
  $("mn").value=nt[d]||"";$("mn").oninput=e=>{if(e.target.value)nt[d]=e.target.value;else delete nt[d];save()};timerUI(d);
  const tl=[`"${T[d-1][0]}" ka lesson padho ya video dekho 👀`,pack[1],"Ghar walon ko 1 line me samjhao 🗣️"];tkd[d]=tkd[d]||[0,0,0];
  $("tk").innerHTML="";tl.forEach((t,i)=>{const b=document.createElement("button");b.className="task"+(tkd[d][i]?" on":"");b.innerHTML="<i>"+(tkd[d][i]?"✓":"")+"</i>";b.appendChild(document.createTextNode(t));
    b.onclick=()=>{tkd[d][i]=tkd[d][i]?0:1;save();b.classList.toggle("on");b.firstChild.textContent=tkd[d][i]?"✓":""};$("tk").appendChild(b)});
  if(qz[d]){$("qb").innerHTML='<p>✅ Quiz poora! +5 XP</p>'}
  else quiz($("qb"),mk(d,d%2),c=>{if(c){qz[d]=1;save();boom();render();toast("Sahi jawab! +5 XP 🧠")}else toast("Phir se try karo 💪")});
  $("sb").textContent=done[d]?"Wapas karo":"Mission poora! 🎉";$("sheet").classList.add("show")}
function timerUI(d){clearInterval(tmr);const el=$("tm");
  if(pr[d]){el.innerHTML="<b>✅ 30 min practice poori! +10 XP</b>";return}
  el.innerHTML='<b>⏱️ 30 min practice</b><div class="clock" id="ck">30:00</div><button class="btn s" id="tg">▶ Start</button><button class="btn s" id="pd">Practice ho gayi ✅</button>';
  let left=1800,run=false,end=0;const ck=$("ck"),tg=$("tg");
  const draw=()=>ck.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");
  const fin=()=>{clearInterval(tmr);pr[d]=1;save();boom();render();toast("30 min practice poori! +10 XP ⏱️");timerUI(d)};
  tg.onclick=()=>{if(run){clearInterval(tmr);run=false;tg.textContent="▶ Phir chalu"}else{run=true;end=Date.now()+left*1000;tg.textContent="⏸ Roko";
    tmr=setInterval(()=>{left=Math.max(0,Math.ceil((end-Date.now())/1000));draw();if(left<=0)fin()},500)}};
  $("pd").onclick=fin}
function openSheetKeep(d){const y=$("sheet").scrollTop;openSheet(d);$("sheet").scrollTop=y}
function planetQuiz(){const wi=cur,w=W[wi];const ds=sh(Array.from({length:w[3]-w[2]+1},(_,i)=>w[2]+i)).slice(0,5);let i=0,sc=0;
  $("sd").textContent="Planet Quiz";$("st").textContent=w[1]+" "+w[0];clearInterval(tmr);hideAll();$("sheet").classList.add("show");
  const nx=()=>{if(i===5){best[wi]=Math.max(best[wi]||0,sc);save();render();$("ss").textContent="";$("qb").innerHTML=`<p>🏆 Score: ${sc}/5<br>+${sc*4} XP tak</p>`;if(sc>=4)boom();return}
    $("ss").textContent=`Sawaal ${i+1}/5`;quiz($("qb"),mk(ds[i],Math.random()<.5?0:1),c=>{if(c)sc++;i++;setTimeout(nx,900)},true)};nx()}
function head(a,b,c){hideAll();$("sd").textContent=a;$("st").textContent=b;$("ss").textContent=c;$("qb").innerHTML="";$("sheet").classList.add("show")}
function flash(){const w=W[cur];let i=w[2],back=false;head("Flash cards",w[1]+" "+w[0],"Card pe tap karo, palat ke dekho");const el=$("qb");
  const draw=()=>{el.innerHTML="";const c=document.createElement("button");c.className="fcard";c.textContent=back?N[i-1]:T[i-1][0]+" 👆";c.onclick=()=>{back=!back;draw()};
    const nav=document.createElement("div");nav.className="nav";
    [["◀",-1],["▶",1]].forEach(([l,d])=>{const b=document.createElement("button");b.className="btn s";b.textContent=l;b.onclick=()=>{i=Math.min(w[3],Math.max(w[2],i+d));back=false;draw()};nav.appendChild(b)});
    const n=document.createElement("small");n.textContent="Din "+i+"  ("+(i-w[2]+1)+"/"+(w[3]-w[2]+1)+")";el.append(c,n,nav)};draw()}
function match(){const w=W[cur];head("Jodi milao",w[1]+" "+w[0],"Topic aur uska matlab jodo");const el=$("qb");
  const ds=[],us=new Set();sh(Array.from({length:w[3]-w[2]+1},(_,i)=>w[2]+i)).forEach(d=>{if(ds.length<4&&!us.has(T[d-1][1])&&!us.has(T[d-1][0])){us.add(T[d-1][1]);us.add(T[d-1][0]);ds.push(d)}});
  const tl=sh(ds.flatMap(d=>[{d,x:T[d-1][0]},{d,x:T[d-1][1]}]));let sel=null,left=ds.length;
  const g=document.createElement("div");g.className="mg";
  tl.forEach(t=>{const b=document.createElement("button");b.className="opt";b.textContent=t.x;
    b.onclick=()=>{if(b.classList.contains("ok")||b===sel)return;
      if(!sel){sel=b;sel.t=t;b.classList.add("sel");return}
      if(sel.t.d===t.d){sel.className=b.className="opt ok";sel=null;if(--left===0){gm++;save();boom();render();$("ss").textContent="🏆 Shabash! Saari jodi mil gayi! +20 XP"}}
      else{const a=sel;a.classList.remove("sel");a.classList.add("no");b.classList.add("no");sel=null;setTimeout(()=>{a.classList.remove("no");b.classList.remove("no")},500)}};
    g.appendChild(b)});el.appendChild(g)}
$("fc").onclick=flash;$("mg").onclick=match;
$("ff").onclick=()=>toast("🎲 "+sh(F[cur])[0],5000);
$("pq").onclick=planetQuiz;
$("worlds").onclick=e=>{const b=e.target.closest(".world");if(!b)return;cur=+b.dataset.i;render();$("panel").scrollIntoView({behavior:"smooth",block:"nearest"})};
$("days").onclick=e=>{const b=e.target.closest(".day");if(b)openSheet(+b.dataset.d)};
$("sx").onclick=()=>{clearInterval(tmr);$("sheet").classList.remove("show")};
$("sb").onclick=()=>{
  if(done[day]){delete done[day]}else{done[day]=iso(new Date());boom();
    const w=W.find(w=>day>=w[2]&&day<=w[3]);
    if(cnt(w[2],w[3])===w[3]-w[2]+1)toast("🏆 "+w[0]+" planet jeet li!");
    else toast("Shabash! Ek mission aur poora ⭐")}
  clearInterval(tmr);save();$("sheet").classList.remove("show");render()};
const sky=$("sky");for(let i=0;i<46;i++){const s=document.createElement("i");s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.animationDelay=(Math.random()*3)+"s";sky.appendChild(s)}
cur=0;render();
if("serviceWorker" in navigator&&location.protocol!=="file:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
